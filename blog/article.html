<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | Blog — Imdad ADENON</title>
    <meta
      id="blog-meta-description"
      name="description"
      content="Article — blog Imdad ADENON, design UI/UX et product design."
    />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article" />
    <meta id="og-title" property="og:title" content="Article | Blog — Imdad ADENON" />
    <meta id="og-description" property="og:description" content="Article — blog Imdad ADENON, design UI/UX et product design." />
    <meta id="og-image" property="og:image" content="https://imdadadenon.vercel.app/assets/images/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" property="twitter:title" content="Article | Blog — Imdad ADENON" />
    <meta id="twitter-description" property="twitter:description" content="Article — blog Imdad ADENON, design UI/UX et product design." />
    <meta id="twitter-image" property="twitter:image" content="https://imdadadenon.vercel.app/assets/images/preview.png" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen">
    <div class="particle-bg fixed inset-0 -z-10 opacity-40 pointer-events-none"></div>

    <nav
      class="sticky top-0 z-50 w-full bg-black/70 backdrop-blur-lg border-b border-gray-800"
    >
      <div
        class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <a href="/" class="text-xl font-bold gradient-text tech-font"
          >IMDAD ADENON</a
        >
        <div class="flex items-center gap-4 text-sm">
          <a href="/blog/" class="text-blue-400 font-medium">← Blog</a>
          <a href="/" class="text-gray-300 hover:text-white transition">Portfolio</a>
        </div>
      </div>
    </nav>

    <article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <header class="mb-10">
        <time
          id="blog-article-date"
          class="text-sm text-blue-300/90 uppercase tracking-wide"
        ></time>
        <h1
          id="blog-article-title"
          class="text-3xl sm:text-4xl font-bold tech-font mt-3 leading-tight"
        >
          …
        </h1>
      </header>

      <div class="rounded-2xl overflow-hidden border border-gray-700/50 mb-10 aspect-[16/9] bg-gray-900">
        <img
          id="blog-article-cover"
          src="/assets/images/preview.png"
          alt=""
          class="w-full h-full object-cover"
          width="1200"
          height="675"
          fetchpriority="high"
        />
      </div>

      <div
        id="blog-article-body"
        class="blog-prose prose prose-invert max-w-none"
      >
        <p class="text-gray-500">Chargement de l’article…</p>
      </div>

      <footer class="mt-16 pt-10 border-t border-gray-800">
        <a
          href="/blog/"
          class="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300"
        >
          <i class="fas fa-arrow-left"></i> Tous les articles
        </a>
      </footer>
    </article>

    <footer class="border-t border-gray-800 py-8 text-center text-gray-500 text-sm">
      <p>© Imdad ADENON</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/blog.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
